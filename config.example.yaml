# =============================================================================
# AI Studio Gemini Gateway 配置
# =============================================================================
#
# 本网关是 Gemini-only 标准化网关，职责为：
#   1. 通过 /v1/ws 接入 AI Studio Provider（浏览器扩展、Agent 等）
#   2. 通过 /v1beta/models/* 暴露 Gemini 兼容 HTTP API
#   3. 将下游请求标准化后转发至 Provider，并返回标准 Gemini 响应
#
# 配置说明：
#   - 配置加载启用严格字段校验，未知字段或已废弃字段将直接报错
#   - 若 duration 值写为纯数字（例如 30 / 300），则按“秒”解释。
#   - 生产环境请将 API Key 替换为强随机值
#
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP 服务
# ---------------------------------------------------------------------------
server:
  # 监听地址
  # 127.0.0.1 仅本机访问（开发推荐）
  # 0.0.0.0   监听所有 IPv4 地址（容器 / 局域网常用）
  host: "127.0.0.1"

  # 监听端口
  port: 8080

  # 读取请求头 / 请求体超时
  read-timeout: "30s"

  # 写响应超时
  # 默认 0s 表示不限制整体写时长，避免 SSE 长流式响应被截断
  write-timeout: "0s"

  # Keep-Alive 空闲连接超时
  idle-timeout: "120s"

  # 优雅关闭超时
  shutdown-timeout: "15s"

  tls:
    # 是否启用 HTTPS
    enabled: false
    # TLS 证书路径
    cert-file: ""
    # TLS 私钥路径
    key-file: ""

# ---------------------------------------------------------------------------
# 下游 HTTP API 访问控制
# ---------------------------------------------------------------------------
access:
  http:
    # 是否启用 HTTP API 鉴权
    enabled: true

    # 密钥列表
    # 支持以下方式携带：
    #   Authorization: Bearer <key>
    #   X-Goog-Api-Key: <key>
    #   X-Api-Key: <key>
    #   ?key=<key>
    #   ?auth_token=<key>
    keys:
      - "replace-with-a-strong-http-api-key"

    # 是否允许 Bearer Token
    allow-bearer: true

    # 从 Header 中提取 Key 的字段名
    header-names:
      - "X-Goog-Api-Key"
      - "X-Api-Key"

    # 从 Query 中提取 Key 的参数名
    query-names:
      - "key"
      - "auth_token"

  cors:
    # 是否启用 CORS
    enabled: false

    # 允许的来源
    allowed-origins:
      - "http://localhost:3000"

    # 允许的请求方法
    allowed-methods:
      - "GET"
      - "POST"
      - "OPTIONS"

    # 允许的请求头
    allowed-headers:
      - "Authorization"
      - "Content-Type"
      - "X-Goog-Api-Key"
      - "X-Api-Key"
      - "X-Request-ID"
      - "X-Session-ID"

    # 允许前端读取的响应头
    expose-headers:
      - "X-Request-ID"
      - "Retry-After"

    # 是否允许跨域携带凭据
    allow-credentials: false

    # 预检响应缓存秒数
    max-age-seconds: 600

# ---------------------------------------------------------------------------
# Provider WebSocket 接入
# ---------------------------------------------------------------------------
websocket:
  # WS 升级路径
  path: "/v1/ws"

  # 握手超时
  handshake-timeout: "10s"

  # WS 读消息超时
  read-timeout: "60s"

  # WS 写消息超时
  write-timeout: "10s"

  # 单条 WS 消息最大字节数（默认 64 MiB）
  max-message-size: 67108864

  heartbeat:
    # 服务端 Ping 间隔
    ping-interval: "30s"
    # 等待 Pong 超时
    pong-timeout: "60s"

  origin:
    # Origin 校验模式：
    # - any：允许任意 Origin（不推荐生产使用）
    # - allow-missing：允许无 Origin；若有 Origin，则必须命中 allowed-origins
    # - strict：必须携带 Origin，且必须命中 allowed-origins
    mode: "allow-missing"

    # 允许的 Provider 页面 Origin
    # 支持两种写法:
    # 1. 精确匹配，例如 https://ai.studio
    # 2. 通配符匹配，例如 https://ais-pre-*.run.app
    #
    # 说明：
    # 外部 Provider 页面虽然可能从 ai.studio / aistudio.google.com 打开，
    # 但真正发起 WebSocket 的运行域往往是 ais-pre-*.run.app 这类托管域。
    # 如果日志中出现 "wsrelay origin rejected"，请优先以日志里的 origin 值为准补充白名单。
    allowed-origins:
      - "https://aistudio.google.com"
      - "https://ai.studio"
      - "https://ais-pre-*.run.app"
      - "https://ais-dev-*.run.app"

  auth:
    # 是否启用 WS Provider 鉴权
    enabled: true

    # WS 握手鉴权密钥
    keys:
      - "replace-with-a-strong-ws-api-key"

    allow-bearer: true

    header-names:
      - "X-Goog-Api-Key"
      - "X-Api-Key"

    query-names:
      - "key"
      - "auth_token"

  provider-identity:
    # Provider ID
    id-header-names:
      - "X-Provider-ID"
    id-query-names:
      - "provider_id"

    # Provider 标签
    label-header-names:
      - "X-Provider-Label"
    label-query-names:
      - "provider_label"
      - "label"

    # Provider 标签组
    tags-header-names:
      - "X-Provider-Tags"
    tags-query-names:
      - "provider_tags"
      - "tags"

    # Provider 优先级
    priority-header-names:
      - "X-Provider-Priority"
    priority-query-names:
      - "provider_priority"
      - "priority"

# ---------------------------------------------------------------------------
# Provider 选路与重试
# ---------------------------------------------------------------------------
routing:
  # 选路策略
  #   round_robin      轮询
  #   fill_first       优先打满第一个可用 Provider
  #   session_affinity 同一会话尽量固定到同一 Provider
  strategy: "round_robin"

  # Session Affinity 绑定保留时长
  session-affinity-ttl: "1h"

  # 首字节前的 Bootstrap 重试次数
  bootstrap-retries: 1

  # Provider 冷却时长
  provider-cooldown: "5m"

# ---------------------------------------------------------------------------
# 静态模型注册表
# ---------------------------------------------------------------------------
models:
  # 模型来源
  #   embedded 使用内置静态模型集
  #   custom   使用下方 entries 自定义模型集
  source: "embedded"

  # 模型别名
  # alias  对外别名
  # target 真实模型名（必须在 entries / embedded 中存在）
  # expose 是否在 /v1beta/models 列表中显示
  aliases:
    - alias: "gemini-pro"
      target: "gemini-2.5-pro"
      expose: true

  # 当 source=custom 时，在此定义模型列表（不得为空）
  # entries:
  #   - name: "gemini-2.5-pro"
  #     display-name: "Gemini 2.5 Pro"
  #     description: "Custom model definition"
  #     version: "2.5"
  #     input-token-limit: 1048576
  #     output-token-limit: 65536
  #     supported-actions:
  #       - "generateContent"
  #       - "streamGenerateContent"
  #       - "countTokens"
  #     supported-generation-methods:
  #       - "generateContent"
  #       - "countTokens"
  #     thinking:
  #       min: 128
  #       max: 32768
  #       dynamic-allowed: true

# ---------------------------------------------------------------------------
# Gemini 协议
# ---------------------------------------------------------------------------
gemini:
  # API 版本前缀
  api-version: "v1beta"

  # 默认 safetySettings 注入模式
  #   auto 请求未携带时自动补充
  #   off  不自动补充
  safety-defaults-mode: "auto"

  # 图片预览模型兼容修复
  image-preview-compatibility: true

  # Thinking 处理
  thinking:
    # 模式
    #   auto 启用 thinking suffix / thinkingConfig 统一处理
    #   off  关闭 thinking 处理
    mode: "auto"

    # 严格校验（true 时，不支持的 thinking 配置会报错而非降级处理）
    strict-validation: false

  # 默认安全设置
  default-safety-settings:
    - category: "HARM_CATEGORY_HARASSMENT"
      threshold: "OFF"
    - category: "HARM_CATEGORY_HATE_SPEECH"
      threshold: "OFF"
    - category: "HARM_CATEGORY_SEXUALLY_EXPLICIT"
      threshold: "OFF"
    - category: "HARM_CATEGORY_DANGEROUS_CONTENT"
      threshold: "OFF"
    - category: "HARM_CATEGORY_CIVIC_INTEGRITY"
      threshold: "BLOCK_NONE"

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
logging:
  # 日志级别：debug / info / warn / error
  level: "info"

  # 日志格式：text / json
  format: "text"

  # 是否附带源码位置信息
  add-source: false

  # 是否启用 HTTP 访问日志（默认关闭）
  access-log: false
